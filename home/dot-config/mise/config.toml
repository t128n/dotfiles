[settings]
npm.package_manager = "bun"

# Tool data and caches live under the XDG-style directories below ~/.local and
# ~/.cache, not at the home root. HOME is unset on Windows, so define it from
# USERPROFILE there; POSIX keeps the HOME mise started with. `~` is not
# expanded in [env] values, so the resolved path is stored instead.
# `mise run env` mirrors these into the Windows user environment so editors and
# GUI apps see the same paths as an activated shell.
[env]
HOME = '{{ get_env(name="USERPROFILE", default=get_env(name="HOME", default="")) }}'
GOPATH = "{{env.HOME}}/.local/share/go"
GOMODCACHE = "{{env.HOME}}/.cache/go/mod"
GOCACHE = "{{env.HOME}}/.cache/go/build"
GOBIN = "{{env.HOME}}/.local/bin"
CARGO_HOME = "{{env.HOME}}/.local/share/cargo"
RUSTUP_HOME = "{{env.HOME}}/.local/share/rustup"
BUN_INSTALL = "{{env.HOME}}/.local/share/bun"
BUN_INSTALL_CACHE_DIR = "{{env.HOME}}/.cache/bun"
_.path = ["~/.local/share/cargo/bin"]

[tools]
bun = "1.4"
node = "lts"
uv = "0.13"
"pypi:copier" = "latest"

opencode = "latest"
"github:anomalyco/hex" = "latest"
"github:t128n/reviewbot" = "latest"

fd = "latest"
fzf = "latest"
go = "1.27"
gh = "latest"
ghq = "latest"
jq = "latest"
ripgrep = "latest"
starship = "latest"
yq = "latest"

gitleaks = "latest"
hk = "latest"
semgrep = "latest"
trivy = "latest"

"npm:agent-desktop" = "latest"
# Official browse MCP server; mise's low-download check needs explicit approval.
# mise owns the runtime: do not also run `browse install`, which adds a native
# binary whose build ID differs from the npm package's and fights over the relay.
"npm:@opencode/browse" = { version = "latest", allow_low_downloads = true }
"npm:webreel" = "latest"
"npm:opensrc" = "latest"
"npm:skills" = "latest"
"npm:emulate" = "latest"
"npm:@oxide/skepsis" = "latest"

[tasks.new]
description = "Create a project from a template"
usage = '''
arg "<template>" help="Template directory name"
arg "<directory>" help="Destination directory"
'''
run = 'copier copy --trust "$HOME/.local/share/t128n-dotfiles/templates/$usage_template" "$usage_directory"'
run_windows = 'copier copy --trust "%USERPROFILE%\.local\share\t128n-dotfiles\templates\%usage_template%" "%usage_directory%"'

[tasks.clean]
description = "Apply the declared system state (dry-run; pass --apply)"
run = 'sh "$HOME/.local/share/t128n-dotfiles/scripts/cleanup/run.sh"'
run_windows = 'pwsh -NoProfile -File "%USERPROFILE%\.local\share\t128n-dotfiles\scripts\cleanup\windows.ps1"'
