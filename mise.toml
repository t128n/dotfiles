min_version = "2026.11.0"

[settings]
dotfiles.root = "home"
npm.package_manager = "bun"

[tools]
starship = "latest"

[dotfiles]
"~/.config/mise/config.toml" = { source = "home/dot-config/mise/config.toml", mode = "symlink" }
"~/.config/starship.toml" = { source = "home/dot-config/starship.toml", mode = "symlink" }
"~/.config/opencode" = { source = "home/dot-config/opencode", mode = "symlink-each" }
"~/.gitconfig" = { source = "home/dot-gitconfig", mode = "symlink" }
"~/.gitconfig-identity" = { source = "home/dot-gitconfig-identity", mode = "copy", create_if_missing = true }
"~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { source = "home/dot-config/powershell/Microsoft.PowerShell_profile.ps1", mode = "symlink" }
"~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json" = { source = "home/dot-config/windows-terminal/settings.json", mode = "symlink" }

[bootstrap.hooks.final]
description = "Check ~/.gitconfig-identity"
run = "grep -q \"Your Name\" ~/.gitconfig-identity 2>/dev/null && echo \"Fill in ~/.gitconfig-identity (mise run gitconfig:identity) with user.name, user.email, and user.signingKey.\" || true"
run_windows = "findstr /C:\"Your Name\" \"%USERPROFILE%\\.gitconfig-identity\" >nul 2>nul && echo Fill in %USERPROFILE%\\.gitconfig-identity (mise run gitconfig:identity) with user.name, user.email, and user.signingKey. || exit /b 0"

[tasks.setup]
description = "Apply this checkout to the current machine"
run = "mise bootstrap"

[tasks.apply]
description = "Deploy dotfiles into $HOME"
run = "mise dot apply"

[tasks.diff]
description = "Preview what apply would change"
run = "mise dot diff"

[tasks.status]
description = "Show the state of every dotfile"
run = "mise dot status"

[tasks.check]
description = "Exit non-zero when a dotfile is missing or differs (CI)"
run = "mise dot status --missing"

[tasks.doctor]
description = "Check mise, Git, and dotfile state"
run = ["mise doctor", "mise dot status"]

[tasks.workspace]
description = "Create the ~/Workspace layout and add ~/.local/bin to the user PATH"
run = "bun scripts/setup-workspace.ts"

[tasks.env]
description = "Mirror the mise [env] defaults into the Windows user environment"
run = "bun scripts/setup-env.ts"

[tasks."env:check"]
description = "Report env defaults that differ from the Windows user environment"
run = "bun scripts/setup-env.ts --check"

[tasks."gitconfig:identity"]
description = "Open ~/.gitconfig-identity in your editor"
run = "${EDITOR:-vi} ~/.gitconfig-identity"
run_windows = "notepad %USERPROFILE%\\.gitconfig-identity"

# Runs after every `mise bootstrap` or `mise run setup`.
[tasks.bootstrap]
description = "Verify the deployment after bootstrap"
run = "mise dot diff"
